#
# GitHub Actions only, and that is the whole list on purpose.
#
# There is nothing else here for Dependabot to watch. Decision D8 in
# docs/03-tech-stack.md rules out Conan and vcpkg so that a distribution
# packager can build this from what they already ship, so there is no manifest
# of C++ dependencies - Qt comes from the platform, and everything else is in
# this repository. nixpkgs is pinned in flake.lock and moving it re-records
# every golden image, which is a deliberate act rather than a bot's.
#
# Actions are different: a third-party action is code we execute with a token,
# and a stale one is the realistic supply-chain exposure in a project with no
# package manager.
#
# Every `uses:` is pinned to a commit hash with the version in a comment beside
# it, so what Dependabot moves here is the hash and the comment together. That
# is the arrangement it is built for, and it is the only one where the update is
# reviewable: a bump from one tag to another shows nothing in the diff about
# what the code became.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      actions:
        patterns: ["*"]
