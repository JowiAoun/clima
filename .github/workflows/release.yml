#
# Cuts a release: builds every shipping artefact, then publishes them together
# with the things a release legally and practically has to carry.
#
# Triggered by the tag that release-please pushes when its pull request merges,
# so the normal path is: merge the release PR, and this runs. workflow_dispatch
# is there to rehearse it without cutting anything.
#
# ==== what gets attached, and why each one is not optional ==================
#
#   the artefacts        .deb, .flatpak, .msi, .zip, .AppImage
#   SHA256SUMS           the only way to check a download that is not signed
#   clima.spdx           an SBOM, generated by `reuse spdx` from the same SPDX
#                        metadata `reuse lint` gates on every commit — so it
#                        describes the tree rather than somebody's memory of it
#   THIRD-PARTY-LICENCES the binary carries Inter, the GeoNames index and
#                        recorded ECCC, NWS and Open-Meteo payloads. Five
#                        licences that are not ours, in a program that would
#                        otherwise appear to be GPL and nothing else.
#   QT-SOURCE-OFFER      LGPLv3 section 4 plus GPLv3 section 6. A link to
#                        qt.io does not discharge it — docs/07 §7.4 is explicit
#                        and correct about that.
#   build provenance     attests that these bytes came out of this workflow at
#                        this commit. It is the closest thing to a signature
#                        available to a project with no certificate, and it is
#                        what `gh attestation verify` checks.
#
# ==== what is NOT here ======================================================
#
# No code signing, on either platform. There is no Windows certificate and no
# Apple Developer ID, so the Windows artefacts trip SmartScreen and there is no
# macOS artefact at all. Both are recorded in docs/known-gaps.md with the
# mitigations, in order. Do not add a signing step here that quietly does
# nothing when the secret is absent — an unsigned build that believes it is
# signed is worse than one that knows it is not.
name: release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  # The two the provenance attestation needs. id-token to get an OIDC token
  # from GitHub, attestations to record the result.
  id-token: write
  attestations: write

jobs:
  # ---- Debian and derivatives ------------------------------------------------
  #
  # In the distribution it is for. The Depends field is derived by
  # dpkg-shlibdeps from the binary's DT_NEEDED entries, so it is only correct
  # when the Qt that was linked is the Qt Debian ships. See cmake/ClimaCPack.cmake.
  deb:
    name: .deb (debian 13)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            libqt6sql6-sqlite libgl1-mesa-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIMA_BUILD_TESTS=OFF \
            -DCLIMA_BUILD_GALLERY=OFF \
            -DCLIMA_DEV_TOOLS=OFF
          cmake --build build

      - name: Package
        run: cd build && cpack -G DEB

      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: build/*.deb
          if-no-files-found: error

  # ---- Flathub's format, as a single file ------------------------------------
  #
  # The P0 channel. This produces a .flatpak bundle for the release page, which
  # is not the same thing as a Flathub submission — that lives in its own
  # repository with a git-sourced manifest, and this is what somebody installs
  # from a download before we are on Flathub at all.
  flatpak:
    name: .flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak flatpak-builder

      # Reads the runtime version out of the manifest rather than repeating it
      # here, so this cannot install a runtime the manifest does not ask for.
      - name: Install the runtime and SDK
        run: scripts/flatpak.sh deps

      - name: Build the bundle
        run: scripts/flatpak.sh bundle

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: build/*.flatpak
          if-no-files-found: error

  # ---- the portable Linux build ----------------------------------------------
  #
  # NEVER RUN. This job was written in an environment with no way to execute it
  # — no linuxdeploy, no 22.04 userland — so it is a first draft rather than a
  # check that passed, and it is `continue-on-error` for exactly that reason: a
  # release with a working .deb, Flatpak and MSI should not be blocked by the
  # P1 artefact. The publish job reports whether it arrived, so a silent
  # absence is not possible. Move it into the required set in the commit that
  # makes it green.
  #
  # 22.04 for glibc 2.35: an AppImage runs on any distribution whose glibc is
  # at least as new as the one it was built against, so the build environment
  # is the compatibility floor. If this runner label is retired, the fix is a
  # container, not a newer runner.
  appimage:
    name: .AppImage (glibc 2.35)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtdeclarative qtpositioning'
          cache: true

      - name: Install linuxdeploy
        run: |
          mkdir -p tools
          cd tools
          for tool in linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage; do
            curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/$tool" \
              || curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/$tool"
            chmod +x "$tool"
          done

      - name: Build and stage
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIMA_BUILD_TESTS=OFF \
            -DCLIMA_BUILD_GALLERY=OFF \
            -DCLIMA_DEV_TOOLS=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build

      # The AppImage bundles Qt, so it conveys it, so it carries the offer and
      # the licence bundle. Same obligation as the Windows artefacts and the
      # same two files.
      - name: Add the licence files a bundled Qt requires
        run: |
          scripts/licence-bundle.sh AppDir/THIRD-PARTY-LICENCES.txt
          cp packaging/QT-SOURCE-OFFER.txt AppDir/
          cp LICENSE AppDir/

      - name: Package
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake6
          EXTRA_QT_MODULES: 'quick;qml'
        run: |
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/io.github.JowiAoun.Clima.desktop \
            --icon-file packaging/icons/clima-256.png

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: '*.AppImage'
          if-no-files-found: error

  # ---- the other shipping desktop --------------------------------------------
  #
  # Both artefacts come out of ONE staged tree, and that is a licensing
  # decision rather than a tidiness one. Windows bundles Qt, so both the ZIP and
  # the MSI convey it; staging once and packaging twice means there is no route
  # to a Windows artefact that skipped the two licence files. It is also why
  # cmake/ClimaCPack.cmake deliberately defines no Windows generator.
  windows:
    name: .msi and .zip (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtdeclarative qtpositioning'
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Version, from the tag
        shell: bash
        run: echo "CLIMA_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # windeployqt runs as part of `cmake --install`, so the staged tree comes
      # out with Qt already beside the executable — see the WIN32 block in
      # app/CMakeLists.txt.
      - name: Build and stage
        shell: bash
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIMA_BUILD_TESTS=OFF \
            -DCLIMA_BUILD_GALLERY=OFF \
            -DCLIMA_DEV_TOOLS=OFF
          cmake --build build
          cmake --install build --prefix stage

      - name: Add the licence files a bundled Qt requires
        shell: bash
        run: |
          scripts/licence-bundle.sh stage/THIRD-PARTY-LICENCES.txt
          cp packaging/QT-SOURCE-OFFER.txt stage/
          cp LICENSE stage/

      - name: Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path stage\* `
            -DestinationPath "clima-$env:CLIMA_RELEASE_VERSION-windows-x64.zip"

      - name: MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix
          wix build packaging\windows\clima.wxs `
            -d Version=$env:CLIMA_RELEASE_VERSION `
            -bindpath "stage=stage" `
            -bindpath "icons=packaging\icons" `
            -o "clima-$env:CLIMA_RELEASE_VERSION-windows-x64.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            *.msi
            *.zip
          if-no-files-found: error

  # ---- publish ---------------------------------------------------------------
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [deb, flatpak, appimage, windows]
    # always(), so that a failed AppImage — the one job allowed to fail — does
    # not take the release with it. The step below reports what arrived.
    if: always()
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Generated BEFORE the artefacts land, and that ordering is not
      # cosmetic: `reuse spdx` walks the project directory, so a dist/ full of
      # binaries at this point would be catalogued as part of the source tree.
      # The SBOM has to describe what was built, not what the build produced.
      - name: The SBOM, the licence bundle and the source offer
        run: |
          mkdir -p meta
          nix develop --command reuse spdx -o meta/clima.spdx
          nix develop --command scripts/licence-bundle.sh meta/THIRD-PARTY-LICENCES.txt
          cp packaging/QT-SOURCE-OFFER.txt meta/

      - uses: actions/download-artifact@v8
        with:
          path: incoming

      - name: Gather
        run: |
          mkdir -p dist
          find incoming -type f \
            \( -name '*.deb' -o -name '*.flatpak' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.zip' \) \
            -exec mv {} dist/ \;
          mv meta/* dist/
          ls -la dist

      # No silent gaps. If an artefact did not arrive, the release notes say so
      # rather than simply not mentioning it — an absent file and a file nobody
      # promised look identical on a release page.
      - name: Report what arrived
        run: |
          {
            echo "### Artefacts"
            echo
            for want in .deb .flatpak .AppImage .msi .zip; do
              if ls dist/*"$want" > /dev/null 2>&1; then
                echo "- \`$want\` — built"
              else
                echo "- \`$want\` — **MISSING**, its job failed"
              fi
            done
          } | tee artefact-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.deb
            dist/*.flatpak
            dist/*.AppImage
            dist/*.msi
            dist/*.zip

      # release-please creates the GitHub Release itself when its pull request
      # merges, with notes built from the conventional-commit history — so by
      # the time this runs the release usually already exists and already says
      # the right thing. Overwriting those notes with our own would throw away
      # the changelog; creating a second release is not possible. So: append if
      # it is there, create if it is not, and upload either way.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release view "$GITHUB_REF_NAME" --json body -q .body > body.md
            printf '\n\n' >> body.md
            cat artefact-report.md >> body.md
            gh release edit "$GITHUB_REF_NAME" --notes-file body.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes-file artefact-report.md
          fi

          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
