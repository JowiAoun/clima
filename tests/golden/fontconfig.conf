<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
SPDX-FileCopyrightText: 2026 Jowi Aoun
SPDX-License-Identifier: GPL-3.0-or-later

The font environment a golden image is taken in.

Pointed at by FONTCONFIG_FILE, which *replaces* the host's main configuration
rather than adding to it. Two things follow from that, and both are the point.

There are no <dir> elements, so fontconfig knows about no fonts at all. That
sounds like a mistake and is the strongest guarantee in this file: Clima's
typeface is compiled into the binary and installed with
QFontDatabase::addApplicationFont, so the app has its face regardless — and with
no system directories to scan, no host font can be substituted into a capture.
A machine with a different set of font packages cannot render a different image.

The <match> block pins rasterisation, which is the part that surprised us.
Measured with the same binary and the same face, host fontconfig against an
empty one:

    Inter 12 px, one 60-character line
      host   advance 341.266   line height 14.5156   ascent 11.625
      empty  advance 336       line height 15        ascent 12

Fractional against integer — one machine positioning glyphs at subpixel offsets
and the other snapping them to the grid, which moves wrap points and shifts a
whole page by a pixel or two. Same code, same face, different pictures. Three
captures of the identical scene under host, pinned and empty configurations gave
three different checksums, so this is not a theoretical concern.

Hinting off rather than on: hinting is where FreeType versions disagree most,
and an unhinted outline is the same outline everywhere. Antialiasing on, because
off would make the comparison insensitive to exactly the subpixel differences it
exists to catch. Greyscale rather than subpixel, because subpixel order is a
property of a physical display and there is not one here.
-->
<fontconfig>
  <match target="font">
    <edit name="antialias"      mode="assign"><bool>true</bool></edit>
    <edit name="hinting"        mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle"      mode="assign"><const>hintnone</const></edit>
    <edit name="rgba"           mode="assign"><const>none</const></edit>
    <edit name="lcdfilter"      mode="assign"><const>lcdnone</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
    <edit name="autohint"       mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
