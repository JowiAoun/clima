SPDX-FileCopyrightText = "2026 Jowi Aoun"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The application icon at the hicolor sizes.
#
# CC-BY-SA-4.0, matching packaging/icons/clima.svg, which carries the licence in
# a header of its own and which these are cut from by scripts/icons.sh. The same
# reasoning the golden-image block at the bottom of this file sets out, applied
# to a different source: a rendering inherits the licence of the thing it is a
# rendering of, because it has no existence apart from it. There the source is
# GPL QML and the images are GPL; here the source is a CC-BY-SA drawing and the
# PNGs are CC-BY-SA.
#
# They are committed rather than generated at build time so that a packager
# without librsvg still gets an icon; scripts/icons.sh check is what stops them
# drifting from the master. PNG has nowhere to put a header.
[[annotations]]
path = [
    "packaging/icons/clima-16.png",
    "packaging/icons/clima-24.png",
    "packaging/icons/clima-32.png",
    "packaging/icons/clima-48.png",
    "packaging/icons/clima-64.png",
    "packaging/icons/clima-128.png",
    "packaging/icons/clima-256.png",
    "packaging/icons/clima-512.png",
    "packaging/icons/clima.ico",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jowi Aoun"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The Debian copyright file, which is the one file here that cannot carry an
# SPDX header for a reason other than syntax. It is a machine-readable document
# in Debian's DEP-5 format whose whole job is to state licensing, and a
# `SPDX-License-Identifier:` line at the top of it would read as a field of
# that document rather than as a header about it — a copyright file that
# appears to declare the package GPL-only, which is precisely the error it
# exists to prevent.
[[annotations]]
path = ["packaging/linux/copyright"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jowi Aoun"
SPDX-License-Identifier = "GPL-3.0-or-later"

# The bundled typeface. Inter 4.1 (git-9221beed3), by The Inter Project Authors,
# under the SIL Open Font License 1.1 — from the upstream release archive,
# https://github.com/rsms/inter/releases/tag/v4.1, unmodified.
#
# The copyright line below is theirs and not ours, and that is the whole point of
# this entry. Every other file in this repository is 2026 Jowi Aoun; these two are
# not, and declaring them that way would be claiming authorship of someone else's
# work. The string is the one the files themselves carry, in name ID 0 of their
# `name` tables — `Copyright 2016 The Inter Project Authors` — with the project
# URL appended as upstream's own LICENSE.txt writes it.
#
# OFL-1.1, matching what upstream declares. The licence text carries no Reserved
# Font Name, so OFL-1.1-no-RFN would describe the grant more narrowly; upstream
# says OFL-1.1, and a redistributor restating someone's licence in stronger terms
# than they used is not a correction we get to make.
#
# Why the licence is satisfied by a binary that ships no text file: OFL §2 accepts
# the notice "in the appropriate machine-readable metadata fields within text or
# binary files as long as those fields can be easily viewed by the user", and both
# files carry the copyright (name ID 0) and the licence (name ID 13) in their own
# name tables. We do not strip them. LICENSES/OFL-1.1.txt is the full text for the
# source distribution.
[[annotations]]
path = [
    "app/fonts/Inter-Regular.ttf",
    "app/fonts/Inter-Bold.ttf",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# The bundled place index, and the recorded geocoding responses beside it.
#
# THIS DATA IS NOT OURS. It is GeoNames — https://www.geonames.org — under
# CC-BY 4.0, and the copyright line below has to say so. Declaring it as
# "2026 Jowi Aoun" would be claiming authorship of a database thirty thousand
# people have contributed to, and it would also break the attribution CC-BY
# requires in exchange for our being allowed to ship it at all.
#
# cities15000.cgx is tools/geonames/pack.mjs's output: the cities15000 dump
# reduced to seven columns and deflated. A transformation of a CC-BY work is a
# work under the same licence; trimming columns and changing the container does
# not make it ours. See libclima/providers/geocoding/geonamesindex.h for what
# it is for, which begins with Nominatim answering 403 to the first
# reverse-geocoding request a properly identified client sends it.
#
# The four JSON files are responses recorded from Open-Meteo's geocoding API,
# which serves the same GeoNames database. They are here because
# docs/04-architecture.md §4.11 wants golden-file provider tests "against
# recorded API responses committed to tests/fixtures/ — no network in CI", and
# they carry GeoNames rows, so they carry the GeoNames credit.
#
# The attribution obligation is also kept where a human can see it:
# docs/02-data-sources.md §2.9 lists GeoNames as CC-BY 4.0, and both geocoders
# return the credit line from attribution() for the About → Data sources screen.
[[annotations]]
path = [
    "libclima/providers/geocoding/data/cities15000.cgx",
    "tests/fixtures/geocoding/get-toronto.json",
    "tests/fixtures/geocoding/search-kigali.json",
    "tests/fixtures/geocoding/search-no-results.json",
    "tests/fixtures/geocoding/search-toronto.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "GeoNames (https://www.geonames.org)"
SPDX-License-Identifier = "CC-BY-4.0"

# Recorded air-quality and forecast responses, for the golden-file tests.
#
# ALSO NOT OURS, and for the same reason as the GeoNames block above: these are
# bytes two weather services sent, kept verbatim so a test can assert what we
# make of them. Copying a JSON response into a repository does not make the
# measurements in it ours.
#
#   tests/fixtures/airquality/*   Open-Meteo's air-quality API, which serves the
#                                 Copernicus Atmosphere Monitoring Service.
#                                 CC-BY 4.0, credited as "Weather data by
#                                 Open-Meteo.com" (docs/02-data-sources.md §2.9).
#
#   tests/fixtures/metno/*        MET Norway Locationforecast 2.0. CC-BY 4.0,
#                                 credited to the Norwegian Meteorological
#                                 Institute.
#
# The two Open-Meteo files are the whole reason the pollen gate can be tested
# without a network: Toronto's six pollen series are null 72/72 and Berlin's are
# null 0/72, recorded on the same afternoon. See
# libclima/providers/airquality/openmeteoairqualityprovider.h.
#
# Both providers' credit lines are returned by attribution() and rendered on the
# About → Data sources screen, which is where the obligation is actually
# discharged; this block is what keeps `reuse lint` able to say so too.
[[annotations]]
path = [
    "tests/fixtures/airquality/berlin.json",
    "tests/fixtures/airquality/toronto.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Open-Meteo (https://open-meteo.com)"
SPDX-License-Identifier = "CC-BY-4.0"

# The forecast fixtures, same service and same licence as the two above, listed
# separately because they answer a different set of questions and because
# tests/fixtures/openmeteo/README.md documents each one individually — the URL
# it came from, the date, and the specific thing it is evidence of.
#
# Two of them are worth naming here rather than only there. `toronto-dst-fall`
# and `toronto-dst-spring` are the record of a property of `timezone=auto` that
# is invisible for ten and a half months of the year: it applies ONE fixed
# offset across the whole window, so its local day is always 24 rows even when
# the real one is 25 or 23. They are recordings and not constructions precisely
# because a file we wrote ourselves would have encoded our belief about that
# rather than the service's behaviour.
[[annotations]]
path = [
    "tests/fixtures/openmeteo/andes-snow.json",
    "tests/fixtures/openmeteo/kampala-precip-spike.json",
    "tests/fixtures/openmeteo/miami-thunder.json",
    "tests/fixtures/openmeteo/svalbard-midnight-sun.json",
    "tests/fixtures/openmeteo/toronto-dst-fall.json",
    "tests/fixtures/openmeteo/toronto-dst-spring.json",
    "tests/fixtures/openmeteo/toronto-ecmwf-gaps.json",
    "tests/fixtures/openmeteo/toronto-summer.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Open-Meteo (https://open-meteo.com)"
SPDX-License-Identifier = "CC-BY-4.0"

# The fixtures the SHIPPED BINARY carries, as distinct from the ones the tests
# read. Same service, same licence, and a separate block because the obligation
# is a different one: these bytes are compiled into `clima` and are redistributed
# with it, so CC-BY 4.0 attaches to the release rather than to the repository.
#
# The app discharges the credit at run time — Engine.sources is generated from
# the provider registry and the recorded provider's attribution() returns
# Open-Meteo's exact credit line plus a note saying which afternoon it is. See
# libclima/providers/fixture/data/README.md for what each one is evidence of.
#
# `kampala/forecast.json` is byte-identical to
# tests/fixtures/openmeteo/kampala-precip-spike.json, deliberately: the adapter
# test and the app's own precipitation-hour proof are assertions about the same
# 0.40 mm, one at the parser and one at the chart.
[[annotations]]
path = [
    "libclima/providers/fixture/data/berlin/airquality.json",
    "libclima/providers/fixture/data/berlin/forecast.json",
    "libclima/providers/fixture/data/kampala/forecast.json",
    "libclima/providers/fixture/data/seattle/airquality.json",
    "libclima/providers/fixture/data/seattle/forecast.json",
    "libclima/providers/fixture/data/toronto/airquality.json",
    "libclima/providers/fixture/data/toronto/forecast.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Open-Meteo (https://open-meteo.com)"
SPDX-License-Identifier = "CC-BY-4.0"

# ---- the alert recordings ---------------------------------------------------
#
# Two more services, two more licences, and neither of them is Open-Meteo's —
# which is why they are a block of their own rather than more paths in the one
# above. Getting this wrong would attach a Creative Commons licence to a work of
# the United States government and a public-domain notice to Crown data.
#
#   api.weather.gc.ca   Environment and Climate Change Canada, under the Open
#                       Government Licence – Canada 2.0. The credit line that
#                       licence asks for is returned by
#                       EcccAlertProvider::attribution() word for word.
#
#   api.weather.gov     A work of the United States federal government, which is
#                       not subject to copyright protection under 17 U.S.C. §105.
#                       That is a *status*, not a grant, and there is no SPDX
#                       identifier that says it without implying a licence
#                       somebody issued. `LicenseRef-` is the mechanism REUSE
#                       provides for exactly this case.
#
# The `libclima/providers/fixture/data/**/alerts.json` files are compiled into
# the shipped binary, so both obligations attach to the release and not only to
# the repository — discharged at run time through Engine.sources, the same way
# the forecast recordings' are.
[[annotations]]
path = [
    "libclima/providers/fixture/data/toronto/alerts.json",
    "tests/fixtures/alerts/eccc/annapolis-heat.json",
    "tests/fixtures/alerts/eccc/fraser-valley-air-quality.json",
    "tests/fixtures/alerts/eccc/toronto-clear.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Environment and Climate Change Canada"
SPDX-License-Identifier = "LicenseRef-OGL-Canada-2.0"

[[annotations]]
path = [
    "libclima/providers/fixture/data/seattle/alerts.json",
    "tests/fixtures/alerts/nws/denver-air-quality.json",
    "tests/fixtures/alerts/nws/minneapolis-clear.json",
    "tests/fixtures/alerts/nws/out-of-bounds.json",
    "tests/fixtures/alerts/nws/phoenix-extreme-heat.json",
    "tests/fixtures/alerts/nws/seattle-four.json",
    "tests/fixtures/alerts/nws/siskiyou-heat-advisory.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "NOAA National Weather Service"
SPDX-License-Identifier = "LicenseRef-US-Public-Domain"

# The manifests beside them are ours: a place, a description and the instant the
# FrozenClock is set to. Not Open-Meteo's data, and JSON has nowhere to put a
# header comment — the same reason every other JSON file in this repository is
# annotated here rather than inline.
[[annotations]]
path = [
    "libclima/providers/fixture/data/berlin/fixture.json",
    "libclima/providers/fixture/data/kampala/fixture.json",
    "libclima/providers/fixture/data/seattle/fixture.json",
    "libclima/providers/fixture/data/toronto/fixture.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jowi Aoun"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = [
    "tests/fixtures/metno/toronto.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "MET Norway — Norwegian Meteorological Institute (https://www.met.no)"
SPDX-License-Identifier = "CC-BY-4.0"

# Configuration and machine-generated manifests. JSON forbids comments, and a
# lockfile is regenerated by a tool that would strip anything we added. None of
# these express a creative choice worth restricting, so they go out under CC0
# to keep them frictionless to copy into another project.
#
# CMakePresets.json is here for the syntax reason rather than the tooling one:
# it is hand-written and it is a build file, but the format has nowhere to put a
# header. Its sibling CMakeLists.txt files carry GPL-3.0-or-later inline, which
# is where the licensing of the build actually lives.
[[annotations]]
path = [
    ".github/release-please-config.json",
    ".gitignore",
    ".release-please-manifest.json",
    "CMakePresets.json",
    "flake.lock",
    "tools/refcap/package.json",
    "tools/refcap/package-lock.json",
    "tools/refcap/targets.json",
    "tests/qmllint-baseline",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jowi Aoun"
SPDX-License-Identifier = "CC0-1.0"

# The golden images and the environment fingerprint beside them.
#
# GPL-3.0-or-later rather than the CC0 that the other machine-generated files
# above take, and rather than the CC-BY-SA-4.0 that assets take, because these
# are neither. A golden image is a rendering of the application's own source: it
# is derived from the QML in app/qml/Clima, it is regenerated by
# scripts/golden.sh whenever that changes, and it has no existence apart from
# it. Licensing the output of GPL sources more permissively than the sources
# would be a way of publishing them under another licence by photographing them.
#
# environment.json joins them because it is recorded in the same act, by
# tst_environment, and means nothing away from the images it describes.
[[annotations]]
path = [
    "tests/golden/images/**.png",
    "tests/golden/environment.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jowi Aoun"
SPDX-License-Identifier = "GPL-3.0-or-later"
